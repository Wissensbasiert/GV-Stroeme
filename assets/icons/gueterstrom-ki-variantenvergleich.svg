<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Drei reduzierte Entwürfe für den Güterströme-KI-Knopf</title>
  <desc id="desc">Vergleich der Varianten Frachtstern, Dialogstern und Datenkorridor, jeweils groß und in Menügröße.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
    <symbol id="a" viewBox="0 0 64 64">
      <path d="M13 13h38l7 7v24l-7 7H13l-7-7V20Z" fill="#63B472"/>
      <path d="M16 18v28M48 18v28" fill="none" stroke="#4C7F83" stroke-linecap="round" stroke-width="3" opacity="0.8"/>
      <path d="M32 18.5c1.45 8.3 5.2 12.05 13.5 13.5C37.2 33.45 33.45 37.2 32 45.5 30.55 37.2 26.8 33.45 18.5 32 26.8 30.55 30.55 26.8 32 18.5Z" fill="#FFFFFF"/>
    </symbol>
    <symbol id="b" viewBox="0 0 64 64">
      <path d="M13 9h38a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H36L24 59V49H13a8 8 0 0 1-8-8V17a8 8 0 0 1 8-8Z" fill="#4C7F83"/>
      <path d="M32 15.5c1.55 8.9 5.6 12.95 14.5 14.5C37.6 31.55 33.55 35.6 32 44.5 30.45 35.6 26.4 31.55 17.5 30 26.4 28.45 30.45 24.4 32 15.5Z" fill="#FFFFFF"/>
    </symbol>
    <symbol id="c" viewBox="0 0 64 64">
      <path d="M27 10H16a8 8 0 0 0-8 8v28a8 8 0 0 0 8 8h11V44h-8a3 3 0 0 1-3-3V23a3 3 0 0 1 3-3h8Z" fill="#63B472"/>
      <path d="M37 10h11a8 8 0 0 1 8 8v28a8 8 0 0 1-8 8H37V44h8a3 3 0 0 0 3-3V23a3 3 0 0 0-3-3h-8Z" fill="#4C7F83"/>
      <path d="M32 18c1.5 8.6 5.4 12.5 14 14-8.6 1.5-12.5 5.4-14 14-1.5-8.6-5.4-12.5-14-14 8.6-1.5 12.5-5.4 14-14Z" fill="#0F172A"/>
    </symbol>
  </defs>
  <rect width="1120" height="560" rx="28" fill="#F8FAFC"/>
  <text x="56" y="62" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0F172A">Drei reduzierte Richtungen</text>
  <text x="56" y="91" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#64748B">Jeweils groß und rechts im Knopf bei tatsächlicher Menügröße dargestellt.</text>

  <g transform="translate(42 126)">
    <rect width="324" height="384" rx="22" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="24" y="22" width="34" height="26" rx="8" fill="#EAF5ED"/>
    <text x="41" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#3E8E50">A</text>
    <use href="#a" x="104" y="48" width="116" height="116"/>
    <text x="24" y="203" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A">Frachtstern</text>
    <text x="24" y="230" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Stärkster Güterverkehrsbezug.</text>
    <text x="24" y="251" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Container stark abstrahiert.</text>
    <rect x="24" y="286" width="276" height="58" rx="15" fill="#63B472"/>
    <rect x="38" y="299" width="32" height="32" rx="8" fill="#FFFFFF"/>
    <use href="#a" x="43" y="304" width="22" height="22"/>
    <text x="84" y="322" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF">KI fragen</text>
    <text x="280" y="322" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#EAF5ED">22 px</text>
  </g>

  <g transform="translate(398 126)">
    <rect width="324" height="384" rx="22" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="24" y="22" width="34" height="26" rx="8" fill="#EAF2F3"/>
    <text x="41" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#4C7F83">B</text>
    <use href="#b" x="104" y="48" width="116" height="116"/>
    <text x="24" y="203" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A">Dialogstern</text>
    <text x="24" y="230" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Sofort als Fragefunktion lesbar.</text>
    <text x="24" y="251" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Güterverkehr bleibt im Buttontext.</text>
    <rect x="24" y="286" width="276" height="58" rx="15" fill="#63B472"/>
    <rect x="38" y="299" width="32" height="32" rx="8" fill="#FFFFFF"/>
    <use href="#b" x="43" y="304" width="22" height="22"/>
    <text x="84" y="322" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF">KI fragen</text>
    <text x="280" y="322" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#EAF5ED">22 px</text>
  </g>

  <g transform="translate(754 126)">
    <rect width="324" height="384" rx="22" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="24" y="22" width="34" height="26" rx="8" fill="#EEF2F6"/>
    <text x="41" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#0F172A">C</text>
    <use href="#c" x="104" y="48" width="116" height="116"/>
    <text x="24" y="203" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A">Datenkorridor</text>
    <text x="24" y="230" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Abstrakter Fluss mit KI-Zentrum.</text>
    <text x="24" y="251" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Eigenständig, technisch und modern.</text>
    <rect x="24" y="286" width="276" height="58" rx="15" fill="#63B472"/>
    <rect x="38" y="299" width="32" height="32" rx="8" fill="#FFFFFF"/>
    <use href="#c" x="43" y="304" width="22" height="22"/>
    <text x="84" y="322" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF">KI fragen</text>
    <text x="280" y="322" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#EAF5ED">22 px</text>
  </g>
</svg>
